services:
  bem-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bem_app
    restart: always
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=256
      - DATABASE_URL=file:/app/prisma/dev.db
      - ENCRYPTION_KEY=3cf6e7ab221557c4c8180cc3fe14f017d46c0b91f70ae346b4bf494c5d9720e5
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=bem_secret_jwt_therapist_platform_2026
      - CRON_SECRET=bem_cron_token_secret_hostinger
      - NEXT_PUBLIC_APP_URL=https://bem.edulara.com.br
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=bem_evolution_super_secret_token_2026
    depends_on:
      - evolution-api
    volumes:
      - ./prisma:/app/prisma
    deploy:
      resources:
        limits:
          cpus: '0.60'
          memory: 384M
        reservations:
          memory: 128M

  evolution-api:
    image: evoapicloud/evolution-api:v1.8.7
    container_name: evolution_api
    restart: always
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      - SERVER_PORT=8080
      - AUTHENTICATION_API_KEY=bem_evolution_super_secret_token_2026
      - DATABASE_ENABLED=false
      - DATABASE_PROVIDER=local
      - LOG_LEVEL=ERROR
    volumes:
      - ./evolution_instances:/evolution/instances
      - ./evolution_store:/evolution/store
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 128M

