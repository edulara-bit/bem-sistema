# Extensão opcional do Docker Compose para rodar o n8n na MESMA VPS com baixo consumo de RAM
# Como subir junto com o B.E.M. e a Evolution API:
# docker compose -f docker-compose.yml -f docker-compose.n8n.yml up -d

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: bem_n8n
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-n8n.edulara.com.br}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=${N8N_WEBHOOK_BASE_URL:-https://n8n.edulara.com.br/}
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      # Otimizações estritas de memória para compartilhar a VPS com segurança
      - NODE_OPTIONS=--max-old-space-size=320
      - DB_TYPE=sqlite
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=48
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=500
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - ./n8n_data:/home/node/.n8n
    depends_on:
      - bem-app
    deploy:
      resources:
        limits:
          cpus: '0.60'
          memory: 448M
        reservations:
          memory: 192M
